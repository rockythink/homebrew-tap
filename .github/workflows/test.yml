name: Formula CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install formula from tap
        run: |
          brew tap rockythink/tap
          brew install rockythink/tap/limitdeck
      - name: Test formula
        run: brew test rockythink/tap/limitdeck
